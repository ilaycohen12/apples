# The whole architecture in one file: 3 services, 2 networks, 1 volume.

services:
  # ---------- Database ----------
  mongo:
    image: mongo:7                      # official MongoDB image
    restart: unless-stopped             # auto-restart if it crashes
    volumes:
      - mongo-data:/data/db             # keep data in a named volume
      - ./db/seed.js:/docker-entrypoint-initdb.d/seed.js:ro   # seed on first start
    networks: [backend]                 # only reachable by the app
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- NodeJS app ----------
  app:
    build: ./app                        # build from app/Dockerfile
    image: apples-app:latest
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017  # "mongo" = service name (Docker DNS)
      DB_NAME: store
    depends_on:
      mongo:
        condition: service_healthy      # start only after mongo is healthy
    deploy:
      replicas: 2                       # 2 app containers behind nginx
    networks: [frontend, backend, monitoring]   # nginx, mongo, AND Prometheus

  # ---------- Load balancer ----------
  nginx:
    image: nginx:1.27-alpine            # official nginx image
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"           # the ONLY port open to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy      # start only after app is healthy
    networks: [frontend]                # can reach the app, NOT the DB
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------- Monitoring (optional: --profile monitoring) ----------
  prometheus:
    image: prom/prometheus:v3.1.0       # official image
    profiles: [monitoring]              # only starts when monitoring is requested
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [monitoring]              # can reach the app, NOT mongo
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:11.4.0       # official image
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"            # view without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer           # anonymous = read-only
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/apples.json  # open straight to our dashboard
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  frontend:                             # nginx <-> app
  backend:                              # app <-> mongo
    internal: true                      # no internet access, isolated
  monitoring:                           # prometheus <-> app <-> grafana

volumes:
  mongo-data:                           # DB files survive container restarts
