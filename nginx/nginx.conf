# Minimal nginx config: load balancer in front of the app containers

events {}   # required block; defaults are fine

http {
  # The group of app containers to balance between.
  # "app" = the compose service name. Docker's internal DNS returns
  # the IPs of ALL app replicas, so nginx balances across all of them
  # (round-robin = one request each, in turn).
  upstream apples_app {
    server app:3000;
  }

  server {
    listen 80;   # nginx listens on port 80 (the only port open to the outside)

    # Metrics are internal only: Prometheus reads them directly from the app
    location = /metrics {
      return 404;
    }

    # Forward every request to the app group
    location / {
      proxy_pass http://apples_app;
      proxy_set_header Host $host;                                   # keep original host
      proxy_set_header X-Real-IP $remote_addr;                       # pass real client IP
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx's own health check (used by Docker)
    location = /nginx-health {
      return 200 "ok\n";
    }
  }
}
